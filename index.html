<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ================================================================
   Chemistry
   ================================================================ */
const METAL = {
  Mg: { name: 'マグネシウム', E: -2.37, M: 24.31, ion: 'Mg²⁺', z: 2 },
  Zn: { name: '亜鉛', E: -0.76, M: 65.38, ion: 'Zn²⁺', z: 2 },
  Cu: { name: '銅', E: 0.34, M: 63.55, ion: 'Cu²⁺', z: 2 },
  Ag: { name: '銀', E: 0.80, M: 107.87, ion: 'Ag⁺', z: 1 },
};
const SOLN = { Ag: '硝酸銀水溶液', Cu: '硫酸銅水溶液', Zn: '硫酸亜鉛水溶液', Mg: '硫酸マグネシウム水溶液' };
const WIRE_NAME = { Cu: '銅線', Zn: '亜鉛線', Mg: 'マグネシウムリボン' };
const ION0 = 0.0040;          // mol of metal ions in the beaker (not shown as a concentration)
const SPEED = 120;            // lab seconds per real second
const K0 = 6.4e-4;            // 1/s for Cu + Ag+ (ΔE = 0.46 V): ~90 % in one hour
function equation(w, s) {
  if (w === s) return null;
  if (METAL[w].E >= METAL[s].E) return null;
  const n = METAL[s].z === 1 ? '2' : '';
  return `${w} + ${n}${METAL[s].ion} → ${METAL[w].ion} + ${n}${s}`;
}

/* ================================================================
   Renderer, scene, camera
   ================================================================ */
const srgb = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
const isMobile = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const DAY_BG = srgb(0.79, 0.83, 0.86), NIGHT_BG = srgb(0.04, 0.06, 0.12);
scene.background = DAY_BG.clone();
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.3, 500);
scene.add(camera);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 8; controls.maxDistance = 120; controls.maxPolarAngle = 1.52; controls.minPolarAngle = 0.1;
function frameCamera() {
  const a = innerWidth / innerHeight;
  const dist = a < 1 ? 50 : 40;
  controls.target.set(a < 1 ? 2.5 : 5.5, a < 1 ? 7.5 : 6.2, 0);
  camera.position.copy(controls.target).addScaledVector(new THREE.Vector3(0.05, 0.22, 0.97).normalize(), dist);
  controls.update();
}
frameCamera();

const hemi = new THREE.HemisphereLight(0xffffff, 0x7b838a, 0.95); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff8ee, 2.2);
sun.position.set(20, 50, 30); sun.target.position.set(0, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -20, near: 10, far: 120 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; sun.shadow.radius = 4;
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0xe6efff, 0.55); fillL.position.set(-30, 20, 20); scene.add(fillL);
// light-up rig (off by default)
const spot = new THREE.SpotLight(0xfff0d8, 0, 60, 0.5, 0.6, 1.2); spot.position.set(6, 26, 18); spot.target.position.set(0, 6, 0); scene.add(spot, spot.target);
const party = [0xff3b3b, 0x2bd96b, 0xffc83b, 0x4aa8ff].map((c, i) => { const l = new THREE.PointLight(c, 0, 30, 2); l.position.set(Math.cos(i * 1.6) * 10, 3 + i * 2, Math.sin(i * 1.6) * 10 + 3); scene.add(l); return l; });

/* ---------- helpers ---------- */
const V2 = (x, y) => new THREE.Vector2(x, y);
const JP = '"Hiragino Sans","Noto Sans JP","Yu Gothic UI",IPAPGothic,system-ui,sans-serif';
function tex(w, h, draw, o = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (o.srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = ANISO;
  if (o.rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(o.rep[0], o.rep[1]); }
  t.userData.canvas = c;
  return t;
}
function add(geo, mat, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (o.p) m.position.set(...o.p);
  if (o.r) m.rotation.set(...o.r);
  if (o.s) m.scale.set(...o.s);
  m.castShadow = !!o.cast; m.receiveShadow = !!o.recv;
  if (o.ro !== undefined) m.renderOrder = o.ro;
  (o.to || scene).add(m);
  return m;
}
function glass(o = {}) {
  const m = new THREE.MeshPhysicalMaterial({ color: o.color ?? 0xffffff, roughness: 0.04, metalness: 0, ior: 1.5,
    transparent: true, opacity: o.op ?? 0.12, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: o.env ?? 1.6 });
  const k = (o.edge ?? 0.5).toFixed(2);
  m.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>',
      `{ float e = 1.0 - abs(dot(normalize(normal), normalize(vViewPosition)));
         e = e * e * e; diffuseColor.a = clamp(diffuseColor.a + e * ${k}, 0.0, 0.9); outgoingLight += vec3(e * 0.05); }
       #include <opaque_fragment>`);
  };
  m.customProgramCacheKey = () => 'g' + k;
  return m;
}
function drawLabel(g, w, h, text, sub, band) {
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#fbfaf6'; g.fillRect(0, 0, w, h);
  g.fillStyle = band; g.fillRect(0, 0, w, 14);
  g.fillStyle = '#111a21'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `800 ${Math.min(44, Math.floor(w * 1.1 / Math.max(3, text.length)))}px ${JP}`; g.fillText(text, w / 2, 60);
  g.font = `500 19px ${JP}`; g.fillStyle = '#4b5e6b'; g.fillText(sub, w / 2, 104);
}
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ================================================================
   Room
   ================================================================ */
const benchMap = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#3b4044'; g.fillRect(0, 0, w, h);
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(im, 0, 0);
}, { rep: [5, 2.5] });
add(new THREE.BoxGeometry(140, 4, 60), new THREE.MeshStandardMaterial({ map: benchMap, roughness: 0.94, envMapIntensity: 0.45 }), { p: [4, -2, -4], recv: true });
const wallMap = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#c1c9cf'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const v = 230 + ((i * 7 + j * 3) % 9); g.fillStyle = `rgb(${v - 3},${v + 1},${v + 4})`;
    g.fillRect(i * 128 + 3, j * 128 + 3, 122, 122);
  }
}, { rep: [12, 6] });
const wallMat = new THREE.MeshStandardMaterial({ map: wallMap, roughness: 0.55, envMapIntensity: 0.6 });
add(new THREE.PlaneGeometry(140, 70), wallMat, { p: [4, 35, -24], recv: true });

/* ================================================================
   Beaker + solution
   ================================================================ */
const BR = 5.6, BH = 15, LIQ = 13.2;
{
  const pts = [V2(0, 0), V2(BR - 0.3, 0), V2(BR, 0.3), V2(BR, BH), V2(BR + 0.25, BH + 0.15), V2(BR - 0.08, BH + 0.05), V2(BR - 0.1, 0.35), V2(BR - 0.35, 0.12), V2(0, 0.12)];
  add(new THREE.LatheGeometry(pts, 64), glass({ op: 0.1, edge: 0.55 }), { ro: 6 });
  const gt = tex(512, 512, (g, w, h) => {
    g.clearRect(0, 0, w, h); g.fillStyle = 'rgba(255,255,255,.85)'; g.font = `600 26px ${JP}`;
    for (let i = 1; i <= 5; i++) { const y = h - i * 80; g.fillRect(20, y, i % 2 ? 50 : 80, 4); if (i % 2 === 0) g.fillText(String(i * 100), 92, y + 9); }
  });
  add(new THREE.CylinderGeometry(BR + 0.01, BR + 0.01, 10, 24, 1, true, -0.25, 0.5), new THREE.MeshBasicMaterial({ map: gt, transparent: true, depthWrite: false }), { p: [0, 5.6, 0], ro: 8 });
}
const liqMat = new THREE.MeshPhysicalMaterial({ color: 0xeef5f8, roughness: 0.08, transparent: true, opacity: 0.22, depthWrite: false, envMapIntensity: 1.2 });
add(new THREE.CylinderGeometry(BR - 0.12, BR - 0.12, LIQ - 0.15, 64), liqMat, { p: [0, 0.15 + (LIQ - 0.15) / 2, 0], ro: 2 });
// label card in front of the beaker
const labTex = tex(384, 128, () => {});
add(new THREE.PlaneGeometry(4.8, 1.6), new THREE.MeshStandardMaterial({ map: labTex, roughness: 0.8 }), { p: [0, 0.85, BR + 2.2], r: [-1.05, 0, 0], recv: true });

/* ================================================================
   Wire tree (group), deposits, star
   ================================================================ */
const treeG = new THREE.Group(); scene.add(treeG);
const BENCH_X = -10.5, ARC_Y = 16.5;
const helix = [];
{

function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (!S.paused) { sim(dt); visuals(dt); }
  controls.update();
  hudT += dt;
  if (hudDirty && hudT > 1 / 15) { hudT = 0; hudDirty = false; updateHud(); }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

// hook for automated checks; has no effect on normal use
window.__tree = {
  get S() { return S; }, METAL, ION0, SPEED, equation, conv, deposit, dissolved, solutionColor,
  insert, setWire, setSol, setStar, setLight, reset, photo,
  counts() { return { needles: needles.count, blobs: blobs.count, bubbles: bubbles.count }; },
  click(id) { document.getElementById(id).click(); },
  step(sec, h = 1 / 60) { for (let t = 0; t < sec; t += h) { sim(h); visuals(h); } updateHud(); renderer.render(scene, camera); },
  hold(on) { renderer.setAnimationLoop(on ? null : frame); if (on) { controls.update(); updateHud(); renderer.render(scene, camera); } },
  view(t, p) { controls.target.set(...t); camera.position.set(...p); controls.update(); }
};
</script>
